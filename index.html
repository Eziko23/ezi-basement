<!DOCTYPE html>
<html lang="en">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/style.css" />
    <title>Account type invalid</title>
    <div class="content">
        <h1>
          Your account type is outdated or invalid
      </h1>
      <h2>
        Choose to migrate your account or wait 60 seconds for your account to be deleted.
      </h2>
      <p>
              <a href="https://simpletoast.glitch.me/site/migrateAccount">
            <button>
        Migrate
      </button>
      </a>
                  <button onclick="deleteFunction()">
        Delete
      </button>
      </p>
  </div>
  <script>
  setTimeout(function() {
localStorage.removeItem('account');
localStorage.removeItem('simplebucks');
window.location.href = "https://simpletoast.glitch.me/";
}, 60000);

    function deleteFunction() {
localStorage.removeItem('account');
localStorage.removeItem('simplebucks');
window.location.href = "https://simpletoast.glitch.me/";
    };
  </script>
</html>
